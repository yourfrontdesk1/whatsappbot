{% extends "admin/base.html" %}
{% block title %}Setup{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 40px auto;">
    <div class="card">
        <h2>First Time Setup</h2>
        <p style="color: #666; margin-bottom: 20px;">Create your business and admin account.</p>

        <form method="POST">
            <h3 style="font-size: 14px; margin-bottom: 10px; color: #1a1a2e;">Business Details</h3>
            <div class="form-group">
                <label>Business Name</label>
                <input type="text" name="business_name" required placeholder="e.g. Body & Mind">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>WhatsApp Number</label>
                    <input type="text" name="whatsapp_number" required placeholder="+350XXXXXXXX">
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" name="phone" placeholder="+350XXXXXXXX">
                </div>
            </div>
            <div class="form-group">
                <label>Business Email</label>
                <input type="email" name="business_email" placeholder="info@yourbusiness.com">
            </div>
            <div class="form-group">
                <label>Address</label>
                <input type="text" name="address" placeholder="Full address">
            </div>

            <hr style="margin: 20px 0; border: none; border-top: 1px solid #eee;">

            <h3 style="font-size: 14px; margin-bottom: 10px; color: #1a1a2e;">Your Admin Account</h3>
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required minlength="8">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Create Account & Business</button>
        </form>
    </div>
</div>
{% endblock %}
